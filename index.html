<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Command Centre</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #06101f;
            color: white;
            text-align: center;
        }

        header {
            padding: 35px 20px 20px;
        }

        header h1 {
            font-size: 42px;
            margin: 0;
        }

        header p {
            font-size: 20px;
            color: #ddd;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: #132c45;
            border-radius: 28px;
            padding: 35px 25px;
            margin: 30px 0;
        }

        .card h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .card p {
            font-size: 20px;
            color: #eee;
            line-height: 1.5;
        }

        input {
            width: 90%;
            padding: 18px;
            border-radius: 15px;
            border: none;
            font-size: 18px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        button {
            background: #2867e8;
            color: white;
            border: none;
            padding: 17px 30px;
            border-radius: 15px;
            font-size: 20px;
            cursor: pointer;
            margin: 8px;
        }

        .trading-button {
            background: #168a5b;
        }

        .video-button {
            background: #8b45d9;
        }

        .social-button {
            background: #d94b7b;
        }

        #status {
            margin-top: 25px;
            font-size: 20px;
            line-height: 1.6;
            white-space: pre-wrap;
            text-align: left;
        }

        .result {
            background: #0b1c2f;
            padding: 20px;
            border-radius: 18px;
            margin-top: 20px;
            text-align: left;
            white-space: pre-wrap;
        }

        .small {
            font-size: 14px !important;
            color: #aaa !important;
        }
    </style>
</head>

<body>

<header>
    <h1>🧠 AI Command Centre</h1>
    <p>Your personal AI automation system</p>
</header>

<div class="container">

    <!-- AI ASSISTANT -->

    <div class="card">
        <h2>🤖 AI Assistant</h2>
        <p>Ask your AI to perform tasks.</p>

        <button onclick="focusAssistant()">
            Open
        </button>
    </div>


    <div class="card">

        <h2>🧠 AI Assistant</h2>

        <p>What would you like me to do?</p>

        <input
            type="text"
            id="command"
            placeholder="Type your command..."
            onkeydown="handleEnter(event)"
        >

        <br>

        <button onclick="sendCommand()">
            Send
        </button>

        <div id="status">
            🤖 System ready.
        </div>

    </div>


    <!-- TRADING CENTRE -->

    <div class="card">

        <h2>📈 Trading Centre</h2>

        <p>
            Enter a stock, index or market for AI analysis.
        </p>

        <input
            type="text"
