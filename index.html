<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Command Centre</title>
<style>
body{margin:0;padding:20px;background:#07111f;color:white;font-family:Arial}
h1{text-align:center}
.card{background:#102943;padding:20px;margin:20px 0;border-radius:18px}
input,button{width:100%;padding:15px;box-sizing:border-box;border-radius:10px;font-size:16px}
input{margin:10px 0;background:#071a2c;color:white;border:1px solid #315777}
button{border:0;color:white;font-weight:bold;margin-top:5px;background:#16a765}
.result{background:#071a2c;padding:15px;margin-top:15px;border-radius:10px;white-space:pre-wrap}
</style>
</head>

<body>

<h1>🧠 AI Command Centre</h1>

<div class="card">
<h2>📈 Trading Centre</h2>
<input id="market" value="NIFTY 50">
<button id="trade">📊 Analyse Market</button>
<div id="tradeResult" class="result">Ready.</div>
</div>

<div class="card">
<h2>🤖 AI Assistant</h2>
<input id="question" placeholder="Type your command">
<button id="ask">🚀 Ask AI</button>
<div id="answer" class="result">Ready.</div>
</div>

<script>
async function callAI(message,box){
box.textContent="🤖 AI is working...";
try{
const r=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:message})
});
const d=await r.json();
if(!r.ok)throw new Error(d.error||"Request failed");
box.textContent=d.reply||"No response received.";
}catch(e){
box.textContent="❌ "+e.message;
}
}

document.getElementById("trade").addEventListener("click",function(){
const market=document.getElementById("market").value.trim();
const box=document.getElementById("tradeResult");
if(!market){box.textContent="Enter a market.";return;}
box.textContent="📊 Analysing "+market+"...";
callAI(
"Analyse "+market+
" as a trading research assistant. Give trend, support, resistance, bullish scenario, bearish scenario and risks. Do not guarantee profit.",
box
);
});

document.getElementById("ask").addEventListener("click",function(){
const q=document.getElementById("question").value.trim();
const box=document.getElementById("answer");
if(!q){box.textContent="Type a command.";return;}
callAI(q,box);
});
</script>

</body>
</html>
