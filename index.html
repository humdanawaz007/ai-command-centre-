<!DOCTYPE html>
<html>
<head>
    <title>AI Command Centre</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            background: #10243a;
            margin: 15px auto;
            padding: 20px;
            border-radius: 15px;
            max-width: 400px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 10px;
        }

        #assistant {
            display: none;
            background: #162b44;
            padding: 20px;
            border-radius: 15px;
            margin: 20px auto;
            max-width: 400px;
        }

        input {
            width: 90%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin: 10px 0;
        }

        #status {
            margin-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <h1>🧠 AI Command Centre</h1>

    <p>Your personal AI automation system</p>

    <div class="card">
        <h2>AI Assistant</h2>
        <p>Ask your AI to perform tasks.</p>
        <button onclick="openAssistant()">Open</button>
    </div>

    <div id="assistant">

        <h2>🧠 AI Assistant</h2>

        <p>What would you like me to do?</p>

        <input
            id="command"
            placeholder="Type your command..."
        >

        <br>

        <button onclick="sendCommand()">Send</button>

    </div>

    <p id="status">System ready.</p>

    <script>

        function openAssistant() {

            document.getElementById("assistant").style.display = "block";

            document.getElementById("status").innerText =
                "🧠 AI Assistant opened. Ready for your command.";

        }


        async function sendCommand() {

            const command =
                document.getElementById("command").value;

            if (command.trim() === "") {

                alert("Please enter a command.");

                return;
            }


            document.getElementById("status").innerText =
                "🤖 AI is thinking...";


            try {

                const response = await fetch("/api/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: command
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "Something went wrong"
                    );

                }


                document.getElementById("status").innerText =
                    "🤖 " + data.reply;


            } catch (error) {

                document.getElementById("status").innerText =
                    "❌ Error: " + error.message;

            }

        }

    </script>

</body>
</html>
