<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Command Centre</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:#fff;
}

.container{
max-width:900px;
margin:auto;
padding:16px;
}

header{
text-align:center;
padding:20px 0;
}

header h1{
margin:0;
font-size:28px;
}

header p{
color:#9ca3af;
}

.card{
background:#151b2e;
border:1px solid #28304a;
border-radius:16px;
padding:18px;
margin-bottom:16px;
}

.card h2{
margin-top:0;
}

label{
display:block;
margin:12px 0 6px;
color:#cbd5e1;
}

input,select{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #374151;
background:#0d1324;
color:#fff;
font-size:15px;
}

button{
border:0;
border-radius:10px;
padding:13px 16px;
margin-top:12px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.primary{
width:100%;
background:#2563eb;
color:#fff;
}

.secondary{
background:#374151;
color:#fff;
}

.success{
background:#16a34a;
color:#fff;
}

.danger{
background:#dc2626;
color:#fff;
}

.video{
background:#7c3aed;
color:#fff;
width:100%;
}

.render{
background:#0891b2;
color:#fff;
width:100%;
}

.status{
padding:12px;
background:#0d1324;
border-radius:10px;
color:#93c5fd;
margin-top:12px;
}

pre{
white-space:pre-wrap;
word-wrap:break-word;
background:#0d1324;
padding:14px;
border-radius:10px;
line-height:1.5;
min-height:120px;
}

.small{
color:#9ca3af;
font-size:13px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.platform{
background:#0d1324;
border:1px solid #374151;
padding:15px;
border-radius:10px;
text-align:center;
}

.log{
max-height:250px;
