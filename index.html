<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Command Centre</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #06101f;
            color: white;
            text-align: center;
        }

        header {
            padding: 35px 20px 20px;
        }

        header h1 {
            font-size: 42px;
            margin: 0;
        }

        header p {
            font-size: 20px;
            color: #ddd;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: #132c45;
            border-radius: 28px;
            padding: 35px 25px;
            margin: 30px 0;
        }

        .card h2 {
            font-size: 34px;
            margin-bottom: 20px;
        }

        .card p {
            font-size: 20px;
            color: #eee;
        }

        input {
            width: 90%;
            padding: 18px;
            border-radius: 15px;
            border: none;
            font-size: 18px;
            margin: 20px 0;
            box-sizing: border-box;
        }

        button {
            background: #2867e8;
            color: white;
            border: none;
            padding: 17px 35px;
            border-radius: 15px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #1d55c5;
        }

        #status {
            margin-top: 25px;
            font-size: 20px;
            line-height: 1.6;
            white-space: pre-wrap;
            text-align: left;
        }

        .response-box {
            background: #0b1c2f;
            padding: 20px;
            border-radius: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🧠 AI Command Centre</h1>
        <p>Your personal AI automation system</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>AI Assistant</h2>

            <p>Ask your AI to perform tasks.</p>

            <button onclick="openAssistant()">
                Open
            </button>
        </div>

        <div class="card">

            <h2>🧠 AI Assistant</h2>

            <p>What would you like me to do?</p>

            <input
                type="text"
                id="command"
                placeholder="Type your command..."
                onkeydown="handleEnter(event)"
            >

            <br>

            <button onclick="sendCommand()">
                Send
            </button>

            <div id="status">
                🤖 System ready.
            </div>

        </div>

    </div>


<script>

let conversation = [];


function openAssistant() {

    document.getElementById("command").focus();

}


function handleEnter(event) {

    if (event.key === "Enter") {
        sendCommand();
    }

}


async function sendCommand() {

    const input = document.getElementById("command");

    const command = input.value.trim();

    if (command === "") {

        alert("Please enter a command.");

        return;
    }


    document.getElementById("status").innerText =
        "🤖 AI is thinking...";


    conversation.push({
        role: "user",
        content: command
    });


    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                message: command,

                conversation: conversation

            })

        });


        const data = await response.json();
