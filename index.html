<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI Command Centre</title>

<style>

body{
margin:0;
padding:20px;
background:#07111f;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
margin-bottom:30px;
}

.card{
background:#102943;
padding:20px;
margin:20px 0;
border-radius:18px;
}

h2{
margin-top:0;
}

input{
width:100%;
padding:15px;
box-sizing:border-box;
border-radius:10px;
font-size:16px;
margin:10px 0;
background:#071a2c;
color:white;
border:1px solid #315777;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:10px;
font-size:17px;
font-weight:bold;
color:white;
margin-top:5px;
background:#16a765;
}

button:active{
transform:scale(.98);
}

.result{
background:#071a2c;
padding:15px;
margin-top:15px;
border-radius:10px;
white-space:pre-wrap;
line-height:1.6;
}

</style>

</head>

<body>

<h1>🧠 AI Command Centre</h1>


<!-- TRADING -->

<div class="card">

<h2>📈 Trading Centre</h2>

<p>Research a stock or index with AI.</p>

<input
id="market"
value="NIFTY 50"
placeholder="Enter stock or index">

<button
id="trade"
type="button">

📊 Analyse Market

</button>

<div
id="tradeResult"
class="result">

Ready.

</div>

</div>


<!-- AI ASSISTANT -->

<div class="card">

<h2>🤖 AI Assistant</h2>

<p>Ask your personal AI assistant anything.</p>

<input
id="question"
placeholder="Type your command">

<button
id="ask"
type="button">

🚀 Ask AI

</button>

<div
id="answer"
class="result">

Ready.

</div>

</div>


<!-- VIDEO CREATOR -->

<div class="card">

<h2>🎬 Video Creator</h2>

<p>Create professional short-form videos with AI.</p>

<input
id="videoTopic"
placeholder="Example: 5 AI tools that can make money">

<button
id="videoButton"
type="button">

🎬 Create Video

</button>

<div
id="videoResult"
class="result">

Ready.

</div>

</div>


<script>


/* =========================
   AI FUNCTION
========================= */

async function callAI(message,box){

box.textContent="🤖 AI is working...";

try{

const response=await fetch(
"/api/chat",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:message
})

}
);


const data=await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Request failed"
);

}


box.textContent=
data.reply ||
"No response received.";


}catch(error){

box.textContent=
"❌ "+error.message;

}

}


/* =========================
   TRADING
========================= */

document
.getElementById("trade")
.addEventListener(
"click",
function(){

const market=
document
.getElementById("market")
.value
.trim();

const box=
document
.getElementById("tradeResult");


if(!market){

box.textContent=
"Enter a stock or index.";

return;

}


box.textContent=
"📊 Analysing "+
market+"...";


const prompt=

"Analyse "+
market+
" as a trading research assistant. "+
"Give me trend, support, resistance, "+
"bullish scenario, bearish scenario, "+
"key risks and what live market data "+
"should be checked before considering "+
"a trade. Do not guarantee profit.";


callAI(
prompt,
box
);

}
);


/* =========================
   AI ASSISTANT
========================= */

document
.getElementById("ask")
.addEventListener(
"click",
function(){

const question=
document
.getElementById("question")
.value
.trim();

const box=
document
.getElementById("answer");


if(!question){

box.textContent=
"Type a command.";

return;

}


callAI(
question,
box
);

}
);


/* =========================
   VIDEO CREATOR
========================= */

document
.getElementById("videoButton")
.addEventListener(
"click",
function(){

const topic=
document
.getElementById("videoTopic")
.value
.trim();

const box=
document
.getElementById("videoResult");


if(!topic){

box.textContent=
"⚠️ Enter a video topic first.";

return;

}


const prompt=

"Create a professional short-form video package about "+
topic+
". Use plain text only. "+
"Do not use markdown symbols such as # or **. "+
"Use these exact section headings: "+
"VIDEO TITLE, HOOK, SCRIPT, SCENES, "+
"CALL TO ACTION, CAPTION, HASHTAGS. "+
"Make the video engaging and suitable for "+
"TikTok, Instagram Reels and YouTube Shorts. "+
"Make the script approximately 30 to 60 seconds long.";


callAI(
prompt,
box
);

}
);


/* =========================
   ENTER KEY
========================= */

document
.getElementById("question")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

document
.getElementById("ask")
.click();

}

}
);

</script>

</body>
</html>
